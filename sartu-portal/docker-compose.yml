services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sartu
      POSTGRES_PASSWORD: devpw
      POSTGRES_DB: sartu_portal
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  app:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://sartu:devpw@db:5432/sartu_portal
      NODE_ENV: production
      BASE_URL: http://localhost:3000
    env_file: [.env]
    ports: ["3000:3000"]
    volumes: ["uploads:/data"]
volumes:
  pgdata:
  uploads:
